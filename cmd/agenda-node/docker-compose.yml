# agenda-node as a docker-compose service. The simpler alternative is a host
# systemd unit (see agenda-node.service) — prefer that unless you specifically
# want the node containerized. Run from the repo root:
#   docker compose -f cmd/agenda-node/docker-compose.yml up -d --build
services:
  agenda-node:
    image: agenda-node:latest
    build:
      context: ../..
      dockerfile: cmd/agenda-node/Dockerfile
    restart: unless-stopped
    # The node's management port must be reachable by the control plane; the
    # proxy port must be reachable by agenda-gateway. Bind to a private
    # interface in production (replace 0.0.0.0 with the private IP) and/or
    # restrict with a host firewall to the control plane + gateway only.
    ports:
      - "7100:7100" # management API (jobs, proxy registration)
      - "7200:7200" # reverse proxy (gateway backends point here)
    volumes:
      - ./config:/app/config:ro
      # Control the host docker daemon (run deploys) from inside the container.
      - /var/run/docker.sock:/var/run/docker.sock
      # The node clones repos and runs compose under workspace_root; it must see
      # the same paths the deployments use. Keep this identical on both sides so
      # bind mounts inside deployed compose files resolve correctly.
      - /root/.agenda-v2/workspaces:/root/.agenda-v2/workspaces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7100/v1/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
