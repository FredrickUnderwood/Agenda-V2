# Serves the built SPA and proxies /api to the control plane container so the
# frontend's relative baseURL ('/api/v1', see src/api/client.ts) works without
# per-environment rebuilds. The upstream host name must match the control
# plane's service name in docker-compose.yml.
#
# /grafana is reverse-proxied to the (optional) Grafana container so its panels
# can be iframe-embedded same-origin — Grafana's own port is never published to
# the host. Grafana runs with GF_SERVER_ROOT_URL=.../grafana + serve_from_sub_path.

# WebSocket upgrade map for Grafana Live (streaming dashboards).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Combined with a variable proxy_pass below, this
    # defers resolving "grafana" until request time, so nginx still starts when
    # the observability profile is off and the grafana service doesn't exist.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        proxy_pass http://control-plane:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /grafana/ {
        # With a variable in proxy_pass, nginx does NOT append the matched
        # location's remaining URI, so pass $request_uri explicitly. It still
        # carries the /grafana/ prefix, which serve_from_sub_path expects.
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
