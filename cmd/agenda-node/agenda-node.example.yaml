# agenda-node configuration. Copy to config/agenda-node.yaml (compose) or
# /etc/agenda-node/agenda-node.yaml (systemd) and fill in the blanks.

# Management API: /v1/jobs, /v1/proxy, /v1/health. Bind to a private interface —
# it is equivalent to remote code execution. Restrict access to the control
# plane's IP with a host firewall.
listen_addr: "0.0.0.0:7100"

# Reverse-proxy port that agenda-gateway backends point at. Restrict to the
# gateway's IP.
proxy_listen_addr: "0.0.0.0:7200"

# The control plane's machine.id this node represents (coordinate with agenda-v2).
machine_id: 0

# Shared per-machine secret; must equal this machine's machine.agent_token in the
# control plane. The control plane generates and encrypts this for you — copy
# the value shown once when the machine is added (or its token is rotated) in
# the agenda-v2 console.
token: "replace-with-random-secret"

# Control plane base URL, for heartbeats.
central_base_url: "http://10.0.0.1:8080"

# Directories the control plane may upload files into (/v1/files). Empty means
# only "must be a clean absolute path" applies — which grants nothing new, since
# /v1/jobs under the same token already runs arbitrary commands. Setting it to
# your workspace root is still worth doing: it stops a control-plane bug from
# writing outside the tree agenda owns.
#
# NOTE for containerized nodes: the node writes inside its own filesystem, so a
# path that is not bind-mounted from the host lands in the container and is lost
# on restart. Keep these roots inside the workspace root the compose file mounts.
file_roots:
  - "/root/.agenda-v2/workspaces"

# Largest single upload accepted. Default 256MiB.
max_upload_bytes: 268435456

heartbeat_interval: "15s"
max_output_bytes: 65536
job_retention: "1h" # how long finished jobs stay in memory before GC
