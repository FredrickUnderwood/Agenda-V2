# agenda-v2 config template. Copy to ~/.config/agenda-v2/agenda-v2.yaml (or
# pass --config) and fill in the blanks. The schema is auto-migrated on startup
# from the Go models, so just point `database.dsn` at an empty database and run.

server:
  addr: ":8080"
  auth_token: ""        # bearer token required on /api/v1/*; empty disables auth
  pprof_addr: "127.0.0.1:6060"

database:
  dsn: "user:password@tcp(127.0.0.1:3306)/agenda_v2?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  addr: "127.0.0.1:6379"
  username: ""
  password: ""
  db: 0

git:
  git_bin: "git"
  operation_timeout: "60s"
  # Static bootstrap tokens (host: token). These are a fallback; the preferred
  # place for a rotating token is the Setting table — set it at runtime via
  #   PUT /api/v1/settings/git.token.github.com  {"value":"ghp_xxx","is_secret":true}
  # which takes effect without a restart and is stored encrypted at rest.
  tokens: {}
    # github.com: "ghp_xxx"

deploy:
  max_output_bytes: 65536
  default_timeout: "5m"
  agent_poll_interval: "2s"   # how often the control plane polls an agenda-node for job status

gateway:
  enabled: false
  base_url: ""
  service_token: ""
  timeout: "10s"
  backend_scheme: "http"
  backend_host: "host.docker.internal"

log:
  level: "info"

security:
  # Encrypts secret Settings at rest (AES-256-GCM). Keep this out of source
  # control and back it up: rotating it makes existing encrypted secrets
  # unreadable. Empty disables encryption (secrets stored in plaintext + warning).
  master_key: ""

auth:
  # Built-in identity. jwt_secret signs user login tokens (HMAC); both the
  # control plane and the gateway verify locally against it. Empty disables user
  # login (the static server.auth_token above still works as a service principal,
  # and with neither set the API is open — dev mode only).
  jwt_secret: ""
  token_ttl: "24h"
  # Seeds the first admin when the user table is empty. Remove/rotate after the
  # first successful login.
  bootstrap_admin_username: ""
  bootstrap_admin_password: ""

observability:
  # How often the alert rule engine evaluates every enabled AlertRule's PromQL
  # against Prometheus. Each tick is N rules x one Prometheus query, so this is
  # separately tunable from other tickers. Prometheus's own base URL and the
  # scrape token Prometheus presents back are NOT here — they're operator-
  # rotatable, so they live in the Setting table (observability.prometheus_url /
  # observability.scrape_token) instead — see deploy/observability/README.md.
  alert_eval_interval: "30s"

workspace_root: "~/.agenda-v2/workspaces"

# Machines are usually managed in the DB (via the API), but may also be declared
# here. `mode` selects how the control plane reaches each one.
machines: {}
  # prod-1-ssh:                         # classic SSH mode (default)
  #   machine_type: prod
  #   mode: ssh
  #   host: 10.0.0.10
  #   user: deploy
  #   port: 22
  #   ssh_key_path: "~/.ssh/id_rsa"
  #   workspace_root: "/root/.agenda-v2/workspaces"
  # prod-1-agent:                       # agenda-node agent mode (no SSH creds needed)
  #   machine_type: prod
  #   mode: agent
  #   agent_base_url: "http://10.0.0.10:7100"        # node management port
  #   agent_proxy_base_url: "http://10.0.0.10:7200"  # node reverse-proxy port (gateway backends point here)
  #   agent_token: "replace-with-random-secret"      # must match this machine's agenda-node.yaml token
  #   workspace_root: "/root/.agenda-v2/workspaces"
